---
name: Example
version: dev
slug: example
description: Example app by Home Assistant Community Apps
url: https://github.com/hassio-addons/app-example
image: ghcr.io/hassio-addons/example/{arch}
init: false
arch:
  - aarch64
  - amd64
machine:
  - green
  - raspberrypi5-64
  - "!odroid-m1"
startup: services
ingress: true
ingress_port: 0
host_network: true
panel_icon: mdi:example
hassio_api: true
hassio_role: manager
supervisor_api_tcp: true
timeout: 30
log_format: timestamp
privileged:
  - CHECKPOINT_RESTORE
  - NET_ADMIN
devices:
  - /dev/ttyUSB0
map:
  - data:rw
  - share
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
  - type: app_config
ports:
  8080/tcp: 8080
  53/udp: null
ports_description:
  8080/tcp: Web interface
  53/udp: DNS
environment:
  LOG_FORMAT: json
ulimits:
  nofile:
    soft: 1024
    hard: 4096
  nproc: 64
services:
  - mqtt:want
options:
  log_level: info
  users:
    - name: admin
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  seconds_between_quotes: int(1,120)?
  ratio: float(0.5,)?
  password: password(8,)?
  serial: device(subsystem=tty)?
  pattern: match(^\d+$)?
  users:
    - name: str
      age: int?
  tags:
    - str
