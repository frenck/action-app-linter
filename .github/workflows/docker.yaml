---
name: Docker

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  DEFAULT_PYTHON: "3.14"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🏗 Set up uv and Python ${{ env.DEFAULT_PYTHON }}
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version: ${{ env.DEFAULT_PYTHON }}
      - name: 🏗 Build wheel
        run: uv build --wheel
      # The image only installs prebuilt wheels, so emulating arm64 costs
      # little, and one build covers both platforms.
      - name: 🏗 Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: 🏗 Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: 🚀 Build image for all platforms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # A path context, not the Git one: the wheel lives in dist/.
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
      # Docker cannot load a multi-platform image, so load the native one
      # for the smoke test. It comes straight from the build cache.
      - name: 🏗 Load image for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: app-linter:test
      - name: 🧪 Smoke test image
        run: docker run --rm app-linter:test --version
      # Runs the image the way GitHub runs the action: inputs as environment
      # variables, the workspace mounted, and annotations on the output.
      - name: 🧪 Lint a valid app the way the action does
        run: |
          docker run --rm \
            --env GITHUB_ACTIONS=true \
            --env INPUT_PATH=./valid \
            --env INPUT_COMMUNITY=true \
            --volume "${PWD}/tests/fixtures/apps:/github/workspace" \
            --workdir /github/workspace \
            app-linter:test
      - name: 🧪 Lint a broken app the way the action does
        run: |
          set +e
          output=$(docker run --rm \
            --env GITHUB_ACTIONS=true \
            --env INPUT_PATH=./cold-backup \
            --volume "${PWD}/tests/fixtures/apps:/github/workspace" \
            --workdir /github/workspace \
            app-linter:test)
          code=$?
          set -e
          echo "${output}"
          if [[ "${code}" != "1" ]]; then
            echo "::error::Expected exit code 1 for a broken app, got ${code}"
            exit 1
          fi
          if ! grep --quiet "^::error file=cold-backup/config.yaml," <<< "${output}"; then
            echo "::error::Expected an annotation on cold-backup/config.yaml"
            exit 1
          fi
